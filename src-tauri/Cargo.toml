[package]
name = "verus-notes"
version = "0.1.0"
description = "Native encrypted notes unlocked by a Verus wallet"
authors = ["Verus Notes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verus_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hkdf = "0.13.0"
sha2 = "0.11.0"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
zeroize = "1.8.2"
base64 = "0.22.1"
bech32 = "0.9"
bs58 = { version = "0.5.1", features = ["check"] }
thiserror = "2.0.18"
hex = "0.4.3"
getrandom = "0.4.2"
ureq = { version = "=2.9.0", default-features = false, features = ["json", "tls"] }
ripemd = "0.1.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
secp256k1 = { version = "0.29.1", features = ["recovery"] }
secrecy = "0.8"
verus_zfunc = { git = "https://github.com/VerusCoin/librustzcash", rev = "df9dc2d4e5f99fd6434ce6ddacbdb43c54bfc293" }
tauri-plugin-opener = "2"
