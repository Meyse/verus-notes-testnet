name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VERUS_NOTES_SIGNER_BASE_URL: ${{ vars.VERUS_NOTES_SIGNER_BASE_URL }}
  VERUS_NOTES_CALLBACK_BASE_URL: ${{ vars.VERUS_NOTES_CALLBACK_BASE_URL }}

jobs:
  frontend:
    name: Frontend and Convex checks
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm verify:frontend

      - name: Verify Convex types
        run: pnpm convex:typecheck

  rust:
    name: Rust tests
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
