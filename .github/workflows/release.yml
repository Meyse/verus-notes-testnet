name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0-alpha.1"
        required: true
        default: "v0.1.0-alpha.1"
      draft:
        description: "Create the release as a draft when it does not already exist"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release when it does not already exist"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

env:
  PUBLIC_CONVEX_URL: ${{ secrets.PUBLIC_CONVEX_URL }}
  VITE_CONVEX_URL: ${{ secrets.PUBLIC_CONVEX_URL }}
  PUBLIC_CONVEX_SITE_URL: ${{ secrets.PUBLIC_CONVEX_SITE_URL }}
  VERUS_API_BASE_URL: ${{ secrets.VERUS_API_BASE_URL }}
  VERUS_NOTES_SIGNER_BASE_URL: ${{ vars.VERUS_NOTES_SIGNER_BASE_URL }}
  VERUS_NOTES_CALLBACK_BASE_URL: ${{ vars.VERUS_NOTES_CALLBACK_BASE_URL }}

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-22.04
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release configuration
        run: |
          set -euo pipefail

          if [[ -z "${PUBLIC_CONVEX_URL}" ]]; then
            echo "PUBLIC_CONVEX_URL secret is missing."
            exit 1
          fi

          if [[ -z "${PUBLIC_CONVEX_SITE_URL}" ]]; then
            echo "PUBLIC_CONVEX_SITE_URL secret is missing."
            exit 1
          fi

          if [[ -z "${VERUS_API_BASE_URL}" ]]; then
            echo "VERUS_API_BASE_URL secret is missing."
            exit 1
          fi

          if [[ -z "${VERUS_NOTES_SIGNER_BASE_URL}" ]]; then
            echo "VERUS_NOTES_SIGNER_BASE_URL variable is missing."
            exit 1
          fi

          if [[ -z "${VERUS_NOTES_CALLBACK_BASE_URL}" ]]; then
            echo "VERUS_NOTES_CALLBACK_BASE_URL variable is missing."
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: pnpm verify:frontend

      - name: Verify Convex types
        run: pnpm convex:typecheck

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-macos:
    name: Build signed notarized macOS DMG
    needs: verify
    runs-on: macos-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_CERTIFICATE}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${KEYCHAIN_PASSWORD}" ]]; then
            echo "Apple signing certificate secrets are missing."
            exit 1
          fi

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/verus-notes-signing.keychain-db"

          printf "%s" "${APPLE_CERTIFICATE}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

          CERT_INFO="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep "Developer ID Application" | head -n 1 || true)"
          if [[ -z "${CERT_INFO}" ]]; then
            echo "No Developer ID Application identity found in the temporary keychain."
            exit 1
          fi

          CERT_ID="$(echo "${CERT_INFO}" | awk -F '"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=${CERT_ID}" >> "${GITHUB_ENV}"
          echo "BUILD_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_PRIVATE_BASE64: ${{ secrets.APPLE_API_KEY_PRIVATE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_API_KEY_PRIVATE_BASE64}" ]]; then
            echo "APPLE_API_KEY_PRIVATE_BASE64 secret is missing."
            exit 1
          fi

          API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf "%s" "${APPLE_API_KEY_PRIVATE_BASE64}" | base64 -D > "${API_KEY_PATH}"
          chmod 600 "${API_KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Build signed notarized universal DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" || -z "${APPLE_API_ISSUER}" || -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_PATH:-}" ]]; then
            echo "Apple notarization configuration is missing."
            exit 1
          fi

          pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Notarize final DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail

          DMG_PATH="$(find src-tauri/target -type f -path "*/release/bundle/dmg/*.dmg" | head -n 1)"
          if [[ -z "${DMG_PATH}" ]]; then
            echo "DMG artifact was not found."
            exit 1
          fi

          xcrun notarytool submit "${DMG_PATH}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      - name: Prepare release artifacts
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          find src-tauri/target -type f -path "*/release/bundle/dmg/*.dmg" -exec cp {} release-artifacts/ \;
          ls -la release-artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: verus-notes-macos-dmg
          path: release-artifacts/*
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always()
        run: |
          if [[ -n "${BUILD_KEYCHAIN_PATH:-}" && -f "${BUILD_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${BUILD_KEYCHAIN_PATH}" || true
          fi

  build-windows:
    name: Build Windows NSIS installer
    needs: verify
    runs-on: windows-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $artifacts = Get-ChildItem -Path src-tauri\target -Recurse -File -Include *.exe |
            Where-Object { $_.FullName -like "*\bundle\nsis\*" }

          if (-not $artifacts) {
            throw "No NSIS installer artifact was found."
          }

          $artifacts | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination release-artifacts
          }

          Get-ChildItem -Path release-artifacts

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: verus-notes-windows-nsis
          path: release-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    needs: verify
    runs-on: ubuntu-22.04
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage

      - name: Prepare release artifacts
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          find src-tauri/target -type f -path "*/release/bundle/appimage/*.AppImage" -exec cp {} release-artifacts/ \;

          if ! find release-artifacts -type f -name "*.AppImage" | grep -q .; then
            echo "No AppImage artifact was found."
            exit 1
          fi

          chmod +x release-artifacts/*.AppImage
          ls -la release-artifacts

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: verus-notes-linux-appimage
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish draft GitHub release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          cd release-artifacts
          rm -f SHA256SUMS.txt
          shasum -a 256 * > SHA256SUMS.txt
          ls -la

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
          RELEASE_DRAFT: ${{ github.event.inputs.draft }}
          RELEASE_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          release_flags=(
            --title "Verus Notes ${TAG_NAME}"
            --notes "Testnet alpha build. Includes signed and notarized macOS DMG, unsigned Windows NSIS installer, and Linux AppImage."
          )

          if [[ "${RELEASE_DRAFT}" == "true" ]]; then
            release_flags+=(--draft)
          fi

          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" \
              release-artifacts/* \
              --target "${GITHUB_SHA}" \
              "${release_flags[@]}"
          fi
